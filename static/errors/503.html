<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100c">
  <title>Garlic is roasted — GarlicSaves</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg:#07100c; --panel:#101f17; --text:#f2f8f4; --muted:#9eb0a5; --green:#5df59a; --line:rgba(174,255,205,.15); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% -20%,rgba(93,245,154,.14),transparent 34rem),var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(560px,100%); padding:52px 42px; border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 28px 90px rgba(0,0,0,.34); text-align:center; }
    .brand { display:inline-flex; align-items:center; gap:10px; margin-bottom:30px; font-size:18px; font-weight:800; letter-spacing:-.03em; }
    .brand img { width:36px; height:36px; }
    .brand span { color:var(--green); }
    .label { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:16px 0 14px; font-size:clamp(32px,7vw,48px); line-height:1.08; letter-spacing:-.045em; }
    p { margin:0 auto 28px; color:var(--muted); font-size:17px; line-height:1.6; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; border-radius:11px; background:var(--green); color:#062411; font-size:14px; font-weight:800; text-decoration:none; }
    a:hover { background:#82ffaf; }
    a:focus-visible { outline:2px solid var(--green); outline-offset:4px; }
    small { display:block; margin-top:24px; color:var(--muted); }
    @media (max-width:520px) { main { padding:38px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/static/favicon.svg" alt="">Garlic<span>Saves</span></div>
    <div class="label">Temporary service interruption</div>
    <h1>Oops! Garlic is roasted!</h1>
    <p>Check back in a little while. We’re already working to get things running smoothly again.</p>
    <a href="/">Try again</a>
    <small>Your saves and jobs are still here.</small>
  </main>
</body>
</html>
